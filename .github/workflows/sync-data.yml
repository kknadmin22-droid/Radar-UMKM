name: Sync Data & Build Jamstack Cache

on:
  schedule:
    # Berjalan otomatis setiap 6 jam
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Izinkan jalankan manual via tombol 'Run workflow' di tab Actions GitHub

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Jamstack Data & Generate Sitemap
        run: node scripts/build-data.js

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/umkm.json sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(jamstack): auto sync umkm data & update sitemap.xml [skip ci]" && git push)
